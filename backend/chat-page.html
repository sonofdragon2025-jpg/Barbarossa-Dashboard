<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbarossa Chat</title><style>body{margin:0;background:#0c1423;color:#edf3fb;font:16px system-ui}main{max-width:780px;margin:auto;padding:20px}a{color:#a9d5ff}.panel{border:1px solid #41516a;border-radius:12px;padding:16px;background:#19263a;margin:16px 0}textarea,button{font:inherit;padding:12px;border-radius:9px}textarea{width:100%;box-sizing:border-box;min-height:90px;background:#eaf0fa;color:#111}button{background:#426b9d;color:#fff;border:0}button:disabled{opacity:.5}.warn{color:#ffdb9a}#messages{white-space:pre-wrap;line-height:1.5}</style></head><body><main><h1>Barbarossa Chat</h1><p>Hiott Holding LLC · <a href="/login">Secure console</a></p><div class="panel"><strong id="state">Checking private session…</strong><p id="details" class="warn"></p></div><div class="panel" id="messages" aria-live="polite">Barbarossa chat interface is installed. AI replies are disabled until provider billing safeguards are verified.</div><form id="form"><label for="message">Your message</label><textarea id="message" maxlength="2000" placeholder="Barbarossa, are you online?"></textarea><p><button id="send" type="submit" disabled>Send to Barbarossa</button></p></form></main><script>const state=document.getElementById('state'),details=document.getElementById('details'),send=document.getElementById('send'),messages=document.getElementById('messages');fetch('/api/chat/status',{credentials:'same-origin'}).then(async r=>{const j=await r.json();if(r.status===401){state.textContent='Sign in required';details.textContent='Open Secure console, sign in, then return to Chat.';return}state.textContent=j.chatEnabled?'Barbarossa online':'Barbarossa chat not yet enabled';details.textContent=j.reason||'';send.disabled=!j.chatEnabled}).catch(()=>{state.textContent='Connection unavailable';details.textContent='Try again when the backend is online.'});document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();messages.textContent='AI replies are not enabled. No message was sent.'})</script></body></html>
